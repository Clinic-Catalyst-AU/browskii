<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:-apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;color:#000;width:460px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 6px;font-weight:700;font-size:23px}
.row{display:flex;align-items:center;gap:20px;padding:10px 22px}
.av{width:98px;height:98px;flex:0 0 98px;box-sizing:border-box;border-radius:50%;padding:3px;background:RINGCOLOR}
.av img{width:92px;height:92px;box-sizing:border-box;border-radius:50%;object-fit:cover;border:3px solid #fff;display:block}
.name{font-weight:700;font-size:20px;line-height:1.25}
.stats{display:flex;gap:24px;margin-top:8px}.stats div{text-align:center;font-size:14px}.stats b{display:block;font-size:18px}
.bio{padding:0 22px;font-size:16px;line-height:1.38}
.cat{color:#737373;margin-bottom:2px}.bio a{color:#00376b;text-decoration:none}
.bio img.e{height:1em;vertical-align:-2px}
.link{color:#00376b;display:block;margin-top:3px}
.btns{display:flex;gap:8px;padding:14px 22px 0}.btns div{flex:1;background:#efefef;border-radius:8px;text-align:center;padding:9px 0;font-weight:600;font-size:15px}
.hl{display:flex;gap:9px;padding:18px 18px 20px;overflow:hidden}.hl div{text-align:center;font-size:10px;width:58px;flex:0 0 58px;line-height:1.15}
.hl span{display:block;width:56px;height:56px;border-radius:50%;border:1px solid #dbdbdb;margin:0 auto 6px;background:#451817;color:#CAD9FD;font-size:7.5px;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;box-sizing:border-box}
</style></head><body>
<div class="top"><span>&lsaquo;&nbsp; HANDLE</span><span style="font-weight:400">&#8942;</span></div>
<div class="row"><div class="av"><img src="avatar.png"></div>
<div><div class="name">NAMEFIELD</div>
<div class="stats"><div><b>POSTS</b>posts</div><div><b>FOLLOWERS</b>followers</div><div><b>FOLLOWING</b>following</div></div></div></div>
<div class="bio"><div class="cat">CATEGORY</div>BIOHTML<a class="link">&#128279; LINKTEXT</a></div>
<div class="btns"><div>Following &#711;</div><div>Message</div><div>Contact</div></div>
<div class="hl">HIGHLIGHTS</div>
</body></html>
